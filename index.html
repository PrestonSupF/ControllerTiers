<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Controller Champs HUD</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: transparent;
            font-family: 'Inter', sans-serif;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            padding-top: 20px;
            overflow: hidden;
        }

        /* Master Layout Container */
        .hud-wrapper {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        /* Left Card: Gamemode */
        .kit-card {
            background: linear-gradient(180deg, rgba(24, 28, 38, 0.95) 0%, rgba(15, 18, 26, 0.98) 100%);
            border: 3px solid #f5b942;
            border-radius: 12px;
            padding: 12px 18px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 4px;
            min-width: 185px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.65);
        }
        .kit-title-row {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 15px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .kit-title-row img {
            width: 20px;
            height: 20px;
            image-rendering: pixelated;
        }
        .kit-sub {
            font-size: 10px;
            font-weight: 700;
            color: #f5b942;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* Center Master Scoreboard Bar */
        .hud-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: linear-gradient(180deg, rgba(24, 28, 38, 0.95) 0%, rgba(15, 18, 26, 0.98) 100%);
            border: 3px solid #f5b942;
            border-radius: 12px;
            padding: 8px 16px;
            width: 900px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.65);
        }

        .player-section {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
        }
        .player-section.p1 { justify-content: flex-start; }
        .player-section.p2 { justify-content: flex-end; }

        .avatar-box {
            width: 48px;
            height: 48px;
            border: 2px solid #f5b942;
            border-radius: 6px;
            background: #111;
            overflow: hidden;
            flex-shrink: 0;
        }
        .avatar-box img {
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
        }

        .stats-col {
            display: flex;
            flex-direction: column;
            gap: 3px;
            flex-grow: 1;
        }
        .p1 .stats-col { align-items: flex-start; }
        .p2 .stats-col { align-items: flex-end; }

        .player-name {
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-shadow: 2px 2px 0px rgba(0, 0, 0, 0.8);
        }

        .health-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
        }
        .p1 .health-row { flex-direction: row; }
        .p2 .health-row { flex-direction: row-reverse; }
        
        /* Bedrock UI Heart Container */
        .hearts-container {
            display: flex;
            align-items: center;
            gap: 2px;
        }

        .sub-info {
            font-family: 'Rajdhani', sans-serif;
            font-size: 12px;
            font-weight: 600;
            color: #9ba3af;
        }

        .divider {
            width: 2px;
            height: 44px;
            background: linear-gradient(180deg, rgba(245, 185, 66, 0.2), #f5b942, rgba(245, 185, 66, 0.2));
            margin: 0 12px;
            flex-shrink: 0;
        }

        .center-block {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 16px;
            font-weight: 700;
        }
        .totem-icon {
            width: 16px;
            height: 16px;
            image-rendering: pixelated;
            opacity: 0.25;
            transition: all 0.2s ease;
        }
        .totem-icon.active {
            opacity: 1;
            filter: drop-shadow(0 0 5px #f5b942);
        }

        /* Right Card: Local Video Placeholder with Chroma Key background */
        .video-card {
            background: linear-gradient(180deg, rgba(24, 28, 38, 0.95) 0%, rgba(15, 18, 26, 0.98) 100%);
            border: 3px solid #f5b942;
            border-radius: 12px;
            width: 185px;
            height: 68px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.65);
            background-color: #00FF00; /* Chroma green fallback for OBS */
        }
        .video-card video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Bottom: Compact Durability Bar */
        .inventory-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: linear-gradient(180deg, rgba(24, 28, 38, 0.95) 0%, rgba(15, 18, 26, 0.98) 100%);
            border: 3px solid #f5b942;
            border-radius: 12px;
            padding: 5px 14px;
            width: 650px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.65);
        }
        .armor-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .armor-slot-inline {
            display: flex;
            align-items: center;
            gap: 4px;
            font-family: 'Rajdhani', sans-serif;
            font-size: 13px;
            font-weight: 700;
        }
        .armor-slot-inline img {
            width: 20px;
            height: 20px;
            image-rendering: pixelated;
        }
        .inventory-label {
            font-family: 'Press Start 2P', monospace;
            font-size: 10px;
            color: #f5b942;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="hud-wrapper">
        <!-- Left: Gamemode Card -->
        <div class="kit-card">
            <div class="kit-title-row">
                <img id="gamemode-icon" src="https://raw.githubusercontent.com/Mojang/bedrock-samples/main/resource_pack/textures/items/diamond_sword.png" alt="Icon">
                <span id="gamemode-label">Sword</span>
            </div>
            <span class="kit-sub">Current Kit</span>
        </div>

        <!-- Center: Main Scoreboard Bar -->
        <div class="hud-bar">
            <!-- Player 1 -->
            <div class="player-section p1">
                <div class="avatar-box">
                    <img id="p1-avatar" src="https://minotar.net/avatar/Steve/64.png" alt="P1">
                </div>
                <div class="stats-col">
                    <div class="player-name" id="p1-name">Steve</div>
                    <div class="health-row">
                        <div class="hearts-container" id="p1-hearts"></div>
                        <span class="sub-info" id="p1-ping">0ms</span>
                    </div>
                </div>
            </div>

            <div class="divider"></div>

            <div class="center-block">
                <img class="totem-icon" id="p1-totem" src="https://raw.githubusercontent.com/Mojang/bedrock-samples/main/resource_pack/textures/items/totem.png" alt="Totem">
                <span id="p1-score">0</span>
                <span>-</span>
                <span id="p2-score">0</span>
                <img class="totem-icon" id="p2-totem" src="https://raw.githubusercontent.com/Mojang/bedrock-samples/main/resource_pack/textures/items/totem.png" alt="Totem">
            </div>

            <div class="divider"></div>

            <!-- Player 2 -->
            <div class="player-section p2">
                <div class="stats-col">
                    <div class="player-name" id="p2-name">Alex</div>
                    <div class="health-row">
                        <span class="sub-info" id="p2-ping">0ms</span>
                        <div class="hearts-container" id="p2-hearts"></div>
                    </div>
                </div>
                <div class="avatar-box">
                    <img id="p2-avatar" src="https://minotar.net/avatar/Alex/64.png" alt="P2">
                </div>
            </div>
        </div>

        <!-- Right: Local Looped Video File -->
        <div class="video-card">
            <video src="chroma-keyed-video_1.webm" autoplay muted loop></video>
        </div>
    </div>

    <!-- Bottom: Compact Durability Bar -->
    <div class="inventory-bar">
        <!-- P1 Armor Dura -->
        <div class="armor-group">
            <div class="armor-slot-inline"><img src="" id="p1-boots-icon"><span id="p1-boots-dur" style="color:#00ff66;">-</span></div>
            <div class="armor-slot-inline"><img src="" id="p1-legs-icon"><span id="p1-legs-dur" style="color:#00ff66;">-</span></div>
            <div class="armor-slot-inline"><img src="" id="p1-chest-icon"><span id="p1-chest-dur" style="color:#00ff66;">-</span></div>
            <div class="armor-slot-inline"><img src="" id="p1-helmet-icon"><span id="p1-helmet-dur" style="color:#00ff66;">-</span></div>
        </div>

        <div class="inventory-label">DURABILITY</div>

        <!-- P2 Armor Dura -->
        <div class="armor-group" style="flex-direction: row-reverse;">
            <div class="armor-slot-inline" style="flex-direction: row-reverse;"><img src="" id="p2-helmet-icon"><span id="p2-helmet-dur" style="color:#00ff66;">-</span></div>
            <div class="armor-slot-inline" style="flex-direction: row-reverse;"><img src="" id="p2-chest-icon"><span id="p2-chest-dur" style="color:#00ff66;">-</span></div>
            <div class="armor-slot-inline" style="flex-direction: row-reverse;"><img src="" id="p2-legs-icon"><span id="p2-legs-dur" style="color:#00ff66;">-</span></div>
            <div class="armor-slot-inline" style="flex-direction: row-reverse;"><img src="" id="p2-boots-icon"><span id="p2-boots-dur" style="color:#00ff66;">-</span></div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script>
        firebase.initializeApp({
            databaseURL: "https://champs-6c8c8-default-rtdb.firebaseio.com/"
        });

        const KIT_ICONS = {
            "sword": "diamond_sword",
            "smp": "ender_pearl",
            "crystal": "end_crystal",
            "crystal (low tier)": "end_crystal",
            "crystal (high tier)": "end_crystal",
            "uhc": "golden_apple",
            "pot": "potion_bottle_splash",
            "mace": "mace",
            "spear mace": "netherite_sword",
            "cart": "tnt_minecart"
        };

        const MAX_DURABILITY = {
            netherite_helmet: 407, netherite_chestplate: 592, netherite_leggings: 555, netherite_boots: 481,
            diamond_helmet: 363, diamond_chestplate: 528, diamond_leggings: 495, diamond_boots: 429,
            iron_helmet: 165, iron_chestplate: 240, iron_leggings: 225, iron_boots: 195,
            golden_helmet: 77, golden_chestplate: 112, golden_leggings: 105, golden_boots: 91
        };

        function cleanItemId(itemName) {
            if (!itemName) return "";
            return itemName.toLowerCase().trim().replace(/([a-z0-9])_helmet/g, '$1_helmet').replace(/ /g, "_").replace(/"/g, "");
        }

        function getItemTexture(itemName) {
            const id = cleanItemId(itemName);
            if (!id || id === "air" || id.includes("air")) return "";
            return `https://raw.githubusercontent.com/Mojang/bedrock-samples/main/resource_pack/textures/items/${id}.png`;
        }

        function updateDurability(imgId, durId, itemName, rawDur) {
            const imgEl = document.getElementById(imgId);
            const durEl = document.getElementById(durId);
            const id = cleanItemId(itemName);

            if (!id || id === "air" || id.includes("air")) {
                imgEl.src = "";
                durEl.innerText = "";
                return;
            }

            imgEl.src = getItemTexture(itemName);
            const maxDur = MAX_DURABILITY[id] || 400;
            const currentDur = Math.max(0, Number(rawDur) || 0);
            durEl.innerText = currentDur;

            const ratio = Math.max(0, Math.min(1, currentDur / maxDur));
            const r = Math.round(139 * (1 - ratio));
            const g = Math.round(255 * ratio);
            const b = Math.round(102 * ratio);
            durEl.style.color = `rgb(${r}, ${g}, ${b})`;
        }

        function renderBedrockHearts(hp, containerId, reverse = false) {
            const container = document.getElementById(containerId);
            container.innerHTML = "";
            const clamped = Math.max(0, Math.min(20, Number(hp) || 0));

            let heartsHTML = "";
            for (let i = 0; i < 10; i++) {
                let heartValue = clamped - (i * 2);
                let bgImg = "https://raw.githubusercontent.com/Mojang/bedrock-samples/main/resource_pack/textures/ui/heart_background.png";
                let fgImg = "";

                if (heartValue >= 2) {
                    fgImg = "https://raw.githubusercontent.com/Mojang/bedrock-samples/main/resource_pack/textures/ui/heart.png";
                } else if (heartValue === 1) {
                    fgImg = "https://raw.githubusercontent.com/Mojang/bedrock-samples/main/resource_pack/textures/ui/heart_half.png";
                }

                heartsHTML += `<div style="position:relative; width:12px; height:12px;">
                    <img src="${bgImg}" style="position:absolute; width:12px; height:12px; image-rendering:pixelated;">
                    ${fgImg ? `<img src="${fgImg}" style="position:absolute; width:12px; height:12px; image-rendering:pixelated;">` : ''}
                </div>`;
            }

            if (reverse) {
                let parser = new DOMParser();
                let doc = parser.parseFromString(heartsHTML, 'text/html');
                let divs = Array.from(doc.body.children).reverse();
                divs.forEach(div => container.appendChild(div));
            } else {
                container.innerHTML = heartsHTML;
            }
        }

        firebase.database().ref('matchState').on('value', (snapshot) => {
            const data = snapshot.val();
            if (!data) return;

            if (data.gamemode) {
                document.getElementById('gamemode-label').innerText = data.gamemode;
                const lowerKey = data.gamemode.toLowerCase().trim();
                const iconName = KIT_ICONS[lowerKey] || "diamond_sword";
                document.getElementById('gamemode-icon').src = `https://raw.githubusercontent.com/Mojang/bedrock-samples/main/resource_pack/textures/items/${iconName}.png`;
            }

            // P1 Data
            const p1Name = data.p1Name || "Steve";
            document.getElementById('p1-name').innerText = p1Name;
            document.getElementById('p1-avatar').src = `https://minotar.net/avatar/${encodeURIComponent(p1Name)}/64.png`;
            renderBedrockHearts(data.p1Hp ?? 20, 'p1-hearts', false);
            document.getElementById('p1-ping').innerText = `${data.p1Ping ?? 0}ms`;
            document.getElementById('p1-score').innerText = data.p1Score ?? 0;
            document.getElementById('p1-totem').classList.toggle('active', Boolean(data.p1Totem));

            updateDurability('p1-helmet-icon', 'p1-helmet-dur', data.p1Helmet, data.p1HelmetDur);
            updateDurability('p1-chest-icon', 'p1-chest-dur', data.p1Chest, data.p1ChestDur);
            updateDurability('p1-legs-icon', 'p1-legs-dur', data.p1Legs, data.p1LegsDur);
            updateDurability('p1-boots-icon', 'p1-boots-dur', data.p1Boots, data.p1BootsDur);

            // P2 Data
            const p2Name = data.p2Name || "Alex";
            document.getElementById('p2-name').innerText = p2Name;
            document.getElementById('p2-avatar').src = `https://minotar.net/avatar/${encodeURIComponent(p2Name)}/64.png`;
            renderBedrockHearts(data.p2Hp ?? 20, 'p2-hearts', true);
            document.getElementById('p2-ping').innerText = `${data.p2Ping ?? 0}ms`;
            document.getElementById('p2-score').innerText = data.p2Score ?? 0;
            document.getElementById('p2-totem').classList.toggle('active', Boolean(data.p2Totem));

            updateDurability('p2-helmet-icon', 'p2-helmet-dur', data.p2Helmet, data.p2HelmetDur);
            updateDurability('p2-chest-icon', 'p2-chest-dur', data.p2Chest, data.p2ChestDur);
            updateDurability('p2-legs-icon', 'p2-legs-dur', data.p2Legs, data.p2LegsDur);
            updateDurability('p2-boots-icon', 'p2-boots-dur', data.p2Boots, data.p2BootsDur);
        });
    </script>
</body>
</html>
