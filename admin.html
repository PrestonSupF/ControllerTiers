<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Controller PvP | Admin Panel</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #090b0e; color: #e2e8f0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    .brutalist-card { background: #11161d; border: 2px solid #1e293b; box-shadow: 4px 4px 0px #000; }
    .brutalist-btn { background: #1e293b; border: 2px solid #334155; box-shadow: 3px 3px 0px #000; transition: all 0.1s ease; }
    .brutalist-btn:hover { transform: translate(-1px, -1px); box-shadow: 4px 4px 0px #000; }
    .brutalist-btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0px #000; }
  </style>
</head>
<body class="min-h-screen p-4 max-w-4xl mx-auto flex flex-col gap-6">

  <!-- PASSWORD MODAL OVERLAY -->
  <div id="auth-modal" class="fixed inset-0 bg-black/90 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="brutalist-card p-6 w-full max-w-md space-y-4 text-center">
      <h2 class="text-xl font-black uppercase text-amber-400">🔒 Admin Authentication</h2>
      <p class="text-xs text-slate-400">Please enter the administrator password to manage the tierlist.</p>
      <input type="password" id="admin-pass-input" placeholder="Enter password..." class="bg-slate-900 border border-slate-700 p-2.5 text-xs text-center font-bold uppercase w-full text-white">
      <button onclick="authenticateAdmin()" class="brutalist-btn w-full py-2.5 bg-amber-500 hover:bg-amber-400 text-black font-black uppercase text-xs">
        Login to Panel
      </button>
      <p id="auth-error" class="text-xs text-red-400 font-bold hidden">Incorrect password!</p>
    </div>
  </div>

  <!-- MAIN ADMIN CONTENT (HIDDEN UNTIL LOGIN) -->
  <div id="admin-content" class="hidden flex flex-col gap-6">

    <header class="brutalist-card p-4 flex justify-between items-center">
      <h1 class="text-xl font-black uppercase text-amber-400">🔧 Controller PvP Admin Panel</h1>
      <div class="flex items-center gap-2">
        <a href="index.html" class="brutalist-btn text-xs font-bold px-3 py-1.5 uppercase">View Site</a>
        <button onclick="logoutAdmin()" class="brutalist-btn text-xs font-bold px-3 py-1.5 uppercase bg-red-900/60 hover:bg-red-800 text-red-200 border-red-700">Logout</button>
      </div>
    </header>

    <!-- PLAYER MANAGEMENT -->
    <section class="brutalist-card p-5 space-y-4">
      <h2 class="text-sm font-black uppercase text-slate-400">Player Management</h2>
      
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="text-xs font-bold text-slate-300">Player Username</label>
          <input type="text" id="player-name" placeholder="e.g. Tynza" class="bg-slate-900 border border-slate-700 p-2 text-xs font-bold uppercase w-full mt-1">
        </div>
        <div>
          <label class="text-xs font-bold text-slate-300">Region</label>
          <select id="player-region" class="bg-slate-900 border border-slate-700 p-2 text-xs font-bold uppercase w-full mt-1">
            <option value="NA">NA (North America)</option>
            <option value="EU">EU (Europe)</option>
            <option value="AS">AS (Asia)</option>
            <option value="SA">SA (South America)</option>
            <option value="OCE">OCE (Oceania)</option>
          </select>
        </div>
      </div>

      <!-- TIER ASSIGNMENTS -->
      <div class="space-y-4">
        <div>
          <h3 class="text-xs font-black uppercase text-sky-400 mb-2 border-b border-slate-800 pb-1">☕ Java Gamemodes</h3>
          <div class="grid grid-cols-2 sm:grid-cols-3 gap-3 text-xs">
            <div><label class="font-bold text-slate-400 block mb-1">Sword</label><select id="tier-sword" class="bg-slate-900 border border-slate-700 p-1.5 text-xs w-full"><option value="">None</option><option value="High S">High S</option><option value="Low S">Low S</option><option value="High A">High A</option><option value="Low A">Low A</option><option value="High B">High B</option><option value="Low B">Low B</option><option value="High C">High C</option><option value="Low C">Low C</option><option value="High D">High D</option><option value="Low D">Low D</option></select></div>
            <div><label class="font-bold text-slate-400 block mb-1">SMP</label><select id="tier-smp" class="bg-slate-900 border border-slate-700 p-1.5 text-xs w-full"><option value="">None</option><option value="High S">High S</option><option value="Low S">Low S</option><option value="High A">High A</option><option value="Low A">Low A</option><option value="High B">High B</option><option value="Low B">Low B</option><option value="High C">High C</option><option value="Low C">Low C</option><option value="High D">High D</option><option value="Low D">Low D</option></select></div>
            <div><label class="font-bold text-slate-400 block mb-1">Crystal</label><select id="tier-crystal" class="bg-slate-900 border border-slate-700 p-1.5 text-xs w-full"><option value="">None</option><option value="High S">High S</option><option value="Low S">Low S</option><option value="High A">High A</option><option value="Low A">Low A</option><option value="High B">High B</option><option value="Low B">Low B</option><option value="High C">High C</option><option value="Low C">Low C</option><option value="High D">High D</option><option value="Low D">Low D</option></select></div>
            <div><label class="font-bold text-slate-400 block mb-1">Mace</label><select id="tier-mace" class="bg-slate-900 border border-slate-700 p-1.5 text-xs w-full"><option value="">None</option><option value="High S">High S</option><option value="Low S">Low S</option><option value="High A">High A</option><option value="Low A">Low A</option><option value="High B">High B</option><option value="Low B">Low B</option><option value="High C">High C</option><option value="Low C">Low C</option><option value="High D">High D</option><option value="Low D">Low D</option></select></div>
            <div><label class="font-bold text-slate-400 block mb-1">UHC</label><select id="tier-uhc" class="bg-slate-900 border border-slate-700 p-1.5 text-xs w-full"><option value="">None</option><option value="High S">High S</option><option value="Low S">Low S</option><option value="High A">High A</option><option value="Low A">Low A</option><option value="High B">High B</option><option value="Low B">Low B</option><option value="High C">High C</option><option value="Low C">Low C</option><option value="High D">High D</option><option value="Low D">Low D</option></select></div>
            <div><label class="font-bold text-slate-400 block mb-1">Pot</label><select id="tier-pot" class="bg-slate-900 border border-slate-700 p-1.5 text-xs w-full"><option value="">None</option><option value="High S">High S</option><option value="Low S">Low S</option><option value="High A">High A</option><option value="Low A">Low A</option><option value="High B">High B</option><option value="Low B">Low B</option><option value="High C">High C</option><option value="Low C">Low C</option><option value="High D">High D</option><option value="Low D">Low D</option></select></div>
          </div>
        </div>

        <div>
          <h3 class="text-xs font-black uppercase text-emerald-400 mb-2 border-b border-slate-800 pb-1">🧱 Bedrock Gamemodes</h3>
          <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 text-xs">
            <div><label class="font-bold text-slate-400 block mb-1">Skywars</label><select id="tier-skywars" class="bg-slate-900 border border-slate-700 p-1.5 text-xs w-full"><option value="">None</option><option value="High S">High S</option><option value="Low S">Low S</option><option value="High A">High A</option><option value="Low A">Low A</option><option value="High B">High B</option><option value="Low B">Low B</option><option value="High C">High C</option><option value="Low C">Low C</option><option value="High D">High D</option><option value="Low D">Low D</option></select></div>
            <div><label class="font-bold text-slate-400 block mb-1">Nodebuff</label><select id="tier-nodebuff" class="bg-slate-900 border border-slate-700 p-1.5 text-xs w-full"><option value="">None</option><option value="High S">High S</option><option value="Low S">Low S</option><option value="High A">High A</option><option value="Low A">Low A</option><option value="High B">High B</option><option value="Low B">Low B</option><option value="High C">High C</option><option value="Low C">Low C</option><option value="High D">High D</option><option value="Low D">Low D</option></select></div>
            <div><label class="font-bold text-slate-400 block mb-1">Midfights</label><select id="tier-midfights" class="bg-slate-900 border border-slate-700 p-1.5 text-xs w-full"><option value="">None</option><option value="High S">High S</option><option value="Low S">Low S</option><option value="High A">High A</option><option value="Low A">Low A</option><option value="High B">High B</option><option value="Low B">Low B</option><option value="High C">High C</option><option value="Low C">Low C</option><option value="High D">High D</option><option value="Low D">Low D</option></select></div>
            <div><label class="font-bold text-slate-400 block mb-1">Bridging</label><select id="tier-bridging" class="bg-slate-900 border border-slate-700 p-1.5 text-xs w-full"><option value="">None</option><option value="High S">High S</option><option value="Low S">Low S</option><option value="High A">High A</option><option value="Low A">Low A</option><option value="High B">High B</option><option value="Low B">Low B</option><option value="High C">High C</option><option value="Low C">Low C</option><option value="High D">High D</option><option value="Low D">Low D</option></select></div>
          </div>
        </div>
      </div>

      <!-- ACTION BUTTONS -->
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 pt-2">
        <button onclick="savePlayerToFirebase()" id="save-btn" class="brutalist-btn py-3 bg-emerald-600 hover:bg-emerald-500 text-white font-black uppercase text-xs tracking-wider">
          💾 Save / Update Player
        </button>
        <button onclick="retirePlayerInFirebase()" id="retire-btn" class="brutalist-btn py-3 bg-amber-600 hover:bg-amber-500 text-white font-black uppercase text-xs tracking-wider">
          🌙 Retire Player
        </button>
        <button onclick="removePlayerFromFirebase()" id="remove-btn" class="brutalist-btn py-3 bg-red-600 hover:bg-red-500 text-white font-black uppercase text-xs tracking-wider">
          🗑️ Remove Player
        </button>
      </div>
    </section>

  </div>

  <script>
    const ADMIN_PASS = "control";
    const FIREBASE_DB_URL = "https://controller-tiers-default-rtdb.firebaseio.com/";

    // Check login state on load
    if (sessionStorage.getItem('admin_authenticated') === 'true') {
      showAdminContent();
    }

    // Allow Enter key for password login
    document.getElementById('admin-pass-input').addEventListener('keyup', (e) => {
      if (e.key === 'Enter') authenticateAdmin();
    });

    function authenticateAdmin() {
      const input = document.getElementById('admin-pass-input').value;
      if (input === ADMIN_PASS) {
        sessionStorage.setItem('admin_authenticated', 'true');
        showAdminContent();
      } else {
        document.getElementById('auth-error').classList.remove('hidden');
      }
    }

    function showAdminContent() {
      document.getElementById('auth-modal').classList.add('hidden');
      document.getElementById('admin-content').classList.remove('hidden');
    }

    function logoutAdmin() {
      sessionStorage.removeItem('admin_authenticated');
      location.reload();
    }

    async function savePlayerToFirebase() {
      const name = document.getElementById('player-name').value.trim();
      const region = document.getElementById('player-region').value;

      if (!name) { alert('Please enter a player username!'); return; }

      const btn = document.getElementById('save-btn');
      btn.textContent = '⏳ Syncing...';
      btn.disabled = true;

      const playerObj = {
        name: name,
        region: region,
        retired: false,
        tiers: {
          sword: document.getElementById('tier-sword').value,
          smp: document.getElementById('tier-smp').value,
          crystal: document.getElementById('tier-crystal').value,
          mace: document.getElementById('tier-mace').value,
          uhc: document.getElementById('tier-uhc').value,
          pot: document.getElementById('tier-pot').value,
          skywars: document.getElementById('tier-skywars').value,
          nodebuff: document.getElementById('tier-nodebuff').value,
          midfights: document.getElementById('tier-midfights').value,
          bridging: document.getElementById('tier-bridging').value
        }
      };

      try {
        const res = await fetch(`${FIREBASE_DB_URL}players/${name.toLowerCase()}.json`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(playerObj)
        });

        if (res.ok) {
          alert(`SUCCESS! "${name}" saved to database!`);
        } else {
          alert('Firebase Error saving player.');
        }
      } catch (err) {
        alert(`Exception: ${err.message}`);
      } finally {
        btn.textContent = '💾 Save / Update Player';
        btn.disabled = false;
      }
    }

    async function retirePlayerInFirebase() {
      const name = document.getElementById('player-name').value.trim();
      if (!name) { alert('Please enter a player username to retire!'); return; }

      if (!confirm(`Are you sure you want to mark "${name}" as RETIRED?`)) return;

      const btn = document.getElementById('retire-btn');
      btn.textContent = '⏳ Retiring...';
      btn.disabled = true;

      const playerObj = {
        name: name,
        region: document.getElementById('player-region').value,
        retired: true,
        tiers: {
          sword: "", smp: "", crystal: "", mace: "", uhc: "", pot: "",
          skywars: "", nodebuff: "", midfights: "", bridging: ""
        }
      };

      try {
        const res = await fetch(`${FIREBASE_DB_URL}players/${name.toLowerCase()}.json`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(playerObj)
        });

        if (res.ok) {
          alert(`SUCCESS! "${name}" has been marked as RETIRED and cleared from active tiers.`);
        } else {
          alert('Firebase Error retiring player.');
        }
      } catch (err) {
        alert(`Exception: ${err.message}`);
      } finally {
        btn.textContent = '🌙 Retire Player';
        btn.disabled = false;
      }
    }

    async function removePlayerFromFirebase() {
      const name = document.getElementById('player-name').value.trim();
      if (!name) { alert('Please enter a player username to remove!'); return; }

      if (!confirm(`Are you sure you want to PERMANENTLY REMOVE "${name}" from the database?`)) return;

      const btn = document.getElementById('remove-btn');
      btn.textContent = '⏳ Removing...';
      btn.disabled = true;

      try {
        const res = await fetch(`${FIREBASE_DB_URL}players/${name.toLowerCase()}.json`, {
          method: 'DELETE'
        });

        if (res.ok) {
          alert(`SUCCESS! "${name}" has been deleted from the tierlist.`);
        } else {
          alert('Firebase Error removing player.');
        }
      } catch (err) {
        alert(`Exception: ${err.message}`);
      } finally {
        btn.textContent = '🗑️ Remove Player';
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
