<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Controller PvP | Admin Dashboard</title>

  <!-- Open Graph / Discord & Social Embed Metadata -->
  <meta property="og:title" content="Controller PvP | Admin Panel">
  <meta property="og:description" content="Admin management panel for updating ranks and tier submissions.">
  <meta property="og:url" content="https://psfpvp.xyz/admin.html">
  <meta property="og:image" content="https://raw.githubusercontent.com/PrestonSupF/ControllerTiers/refs/heads/main/controller_trans.png">
  <meta property="og:type" content="website">

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      background-color: #090b0e;
      color: #e2e8f0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .brutalist-card {
      background: #11161d;
      border: 2px solid #1e293b;
      box-shadow: 4px 4px 0px #000;
    }
    .brutalist-btn {
      background: #1e293b;
      border: 2px solid #334155;
      box-shadow: 3px 3px 0px #000;
      transition: all 0.1s ease;
    }
    .brutalist-btn:hover {
      transform: translate(-1px, -1px);
      box-shadow: 4px 4px 0px #000;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col p-2 sm:p-4 max-w-7xl mx-auto">

  <!-- TOP HEADER -->
  <header class="brutalist-card p-3 mb-4 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <img src="https://raw.githubusercontent.com/PrestonSupF/ControllerTiers/refs/heads/main/controller_trans.png" 
           alt="Controller Logo" 
           class="h-10 w-10 object-contain"
           onerror="this.onerror=null; this.src='https://api.mcheads.org/avatar/2fach/right/192';">
      <h1 class="text-xl font-black tracking-wider uppercase hidden sm:block">Controller PvP - Admin Dashboard</h1>
    </div>

    <nav class="flex items-center gap-2">
      <a href="index.html" class="brutalist-btn px-3 py-1 text-xs font-bold uppercase tracking-wider">Home</a>
      <a href="java.html" class="brutalist-btn px-3 py-1 text-xs font-bold uppercase tracking-wider text-sky-400">☕ Java</a>
      <a href="bedrock.html" class="brutalist-btn px-3 py-1 text-xs font-bold uppercase tracking-wider text-emerald-400">🧱 Bedrock</a>
    </nav>
  </header>

  <!-- ADMIN MANAGEMENT CONTAINER -->
  <main class="grid grid-cols-1 lg:grid-cols-3 gap-6">

    <!-- ADD / EDIT PLAYER FORM -->
    <section class="brutalist-card p-4 sm:p-6 lg:col-span-1 h-fit">
      <h2 id="form-heading" class="text-lg font-black uppercase text-amber-400 mb-4 border-b border-slate-800 pb-2">Add / Edit Player</h2>
      
      <form id="player-form" onsubmit="savePlayer(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-bold uppercase text-slate-400 mb-1">Minecraft Username</label>
          <input type="text" id="admin-name" required placeholder="e.g. Tynza" class="w-full bg-slate-900 border border-slate-700 p-2 text-sm text-white font-bold focus:outline-none focus:border-amber-400">
        </div>

        <div>
          <label class="block text-xs font-bold uppercase text-slate-400 mb-1">Region</label>
          <select id="admin-region" class="w-full bg-slate-900 border border-slate-700 p-2 text-sm text-white uppercase font-bold focus:outline-none">
            <option value="NA">NA</option>
            <option value="EU">EU</option>
            <option value="AS">AS</option>
            <option value="SA">SA</option>
            <option value="OCE">OCE</option>
          </select>
        </div>

        <!-- Mode & Tier Dropdown Selector Section -->
        <div class="space-y-3 pt-2 border-t border-slate-800">
          <h3 class="text-xs font-black uppercase text-slate-400">Assign Mode Tiers</h3>
          
          <div class="space-y-2">
            <div>
              <label class="block text-[10px] text-sky-400 font-bold uppercase mb-1">Select Game Mode</label>
              <select id="active-mode-select" class="w-full bg-slate-900 border border-slate-700 p-2 text-xs text-white uppercase font-bold focus:outline-none">
                <optgroup label="☕ Java Modes">
                  <option value="sword">Sword</option>
                  <option value="smp">SMP</option>
                  <option value="crystal">Crystal</option>
                  <option value="mace">Mace</option>
                  <option value="uhc">UHC</option>
                  <option value="pot">Pot</option>
                </optgroup>
                <optgroup label="🧱 Bedrock Modes">
                  <option value="skywars">Skywars</option>
                  <option value="nodebuff">Nodebuff</option>
                  <option value="midfights">Midfights</option>
                  <option value="bridging">Bridging</option>
                </optgroup>
              </select>
            </div>

            <div>
              <label class="block text-[10px] text-amber-400 font-bold uppercase mb-1">Select Tier Rank</label>
              <select id="active-tier-select" class="w-full bg-slate-900 border border-slate-700 p-2 text-xs text-white uppercase font-bold focus:outline-none">
                <option value="">-- No Tier / Unassigned --</option>
                <option value="High S">High S</option>
                <option value="Low S">Low S</option>
                <option value="High A">High A</option>
                <option value="Low A">Low A</option>
                <option value="High B">High B</option>
                <option value="Low B">Low B</option>
                <option value="High C">High C</option>
                <option value="Low C">Low C</option>
                <option value="High D">High D</option>
                <option value="Low D">Low D</option>
              </select>
            </div>

            <button type="button" onclick="assignTierToPlayer()" class="brutalist-btn bg-sky-600 hover:bg-sky-500 text-white font-bold text-xs uppercase px-3 py-2 w-full mt-1">
              <i class="fa-solid fa-plus"></i> Set Mode Tier
            </button>
          </div>

          <!-- Active Assigned Tiers Preview List -->
          <div class="mt-3">
            <label class="block text-[10px] text-slate-400 font-bold uppercase mb-1">Current Assigned Tiers:</label>
            <div id="assigned-tiers-preview" class="flex flex-wrap gap-1.5 p-2 bg-slate-900/80 border border-slate-800 min-h-[44px]">
              <span class="text-[10px] text-slate-500 italic">No modes assigned yet</span>
            </div>
          </div>
        </div>

        <div class="pt-2">
          <label class="flex items-center gap-2 text-xs font-bold text-slate-300 cursor-pointer">
            <input type="checkbox" id="admin-retired" class="w-4 h-4 accent-amber-400"> Retired Player
          </label>
        </div>

        <div class="flex gap-2 pt-3">
          <button type="submit" class="brutalist-btn bg-amber-500 hover:bg-amber-400 text-black font-black text-xs uppercase px-4 py-2.5 w-full">Save Player to DB</button>
          <button type="button" onclick="resetForm()" class="brutalist-btn bg-slate-800 text-slate-300 font-bold text-xs uppercase px-3 py-2.5">Reset</button>
        </div>
      </form>
    </section>

    <!-- PLAYER LIST DATABASE MANAGEMENT -->
    <section class="brutalist-card p-4 sm:p-6 lg:col-span-2">
      <div class="flex justify-between items-center mb-4 border-b border-slate-800 pb-2">
        <h2 class="text-lg font-black uppercase text-amber-400">Registered Roster</h2>
        <input type="text" id="roster-search" onkeyup="filterRoster()" placeholder="Filter roster..." class="bg-slate-900 border border-slate-700 px-3 py-1 text-xs text-white focus:outline-none">
      </div>

      <div id="roster-list" class="space-y-2 max-h-[600px] overflow-y-auto pr-1">
        <p class="text-xs text-slate-500 italic">Loading players from database...</p>
      </div>
    </section>

  </main>

  <script>
    const FIREBASE_DB_URL = "https://controller-tiers-default-rtdb.firebaseio.com/";
    let playersMap = {};
    let currentEditingTiers = {};

    async function loadAdminData() {
      try {
        const res = await fetch(`${FIREBASE_DB_URL}players.json`);
        if (res.ok) {
          const data = await res.json();
          playersMap = data || {};
        }
      } catch (e) {
        console.warn('Failed to load database:', e);
      }
      renderRoster();
    }

    function renderRoster() {
      const container = document.getElementById('roster-list');
      const keys = Object.keys(playersMap);

      if (keys.length === 0) {
        container.innerHTML = `<p class="text-xs text-slate-500 italic">No players registered in database yet.</p>`;
        return;
      }

      container.innerHTML = keys.map(key => {
        const p = playersMap[key];
        let tierSummary = '';
        if (p.tiers) {
          tierSummary = Object.entries(p.tiers).map(([m, t]) => `<span class="bg-slate-900 border border-slate-700 px-1.5 py-0.5 rounded text-[9px] font-bold text-amber-400 uppercase">${m}: ${t}</span>`).join(' ');
        }
        return `
          <div class="brutalist-card p-3 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 bg-slate-900/60">
            <div class="flex items-center gap-3">
              <img src="https://api.mcheads.org/avatar/${p.name}/right/192" class="h-10 w-10 border border-slate-700 bg-slate-950 object-contain" onerror="this.src='https://api.mcheads.org/avatar/2fach/right/192'">
              <div>
                <h4 class="font-black text-sm text-white normal-case">${p.name} ${p.retired ? '<span class="text-[10px] text-amber-500 font-normal">(RETIRED)</span>' : ''}</h4>
                <p class="text-[10px] text-slate-400 font-mono">Region: ${p.region || 'NA'}</p>
                <div class="flex flex-wrap gap-1 mt-1">${tierSummary || '<span class="text-[10px] text-slate-500 italic">No tiers</span>'}</div>
              </div>
            </div>
            <div class="flex gap-2 self-end sm:self-center">
              <button onclick="editPlayer('${key}')" class="brutalist-btn bg-sky-600 hover:bg-sky-500 text-white px-3 py-1 text-xs font-bold uppercase">Edit</button>
              <button onclick="deletePlayer('${key}')" class="brutalist-btn bg-rose-600 hover:bg-rose-500 text-white px-3 py-1 text-xs font-bold uppercase">Delete</button>
            </div>
          </div>
        `;
      }).join('');
    }

    function assignTierToPlayer() {
      const mode = document.getElementById('active-mode-select').value;
      const tier = document.getElementById('active-tier-select').value;

      if (!tier) {
        delete currentEditingTiers[mode];
      } else {
        currentEditingTiers[mode] = tier;
      }
      renderAssignedPreview();
    }

    function renderAssignedPreview() {
      const container = document.getElementById('assigned-tiers-preview');
      const entries = Object.entries(currentEditingTiers);

      if (entries.length === 0) {
        container.innerHTML = `<span class="text-[10px] text-slate-500 italic">No modes assigned yet</span>`;
        return;
      }

      container.innerHTML = entries.map(([mode, tier]) => `
        <span class="bg-slate-950 border border-slate-700 px-2 py-1 rounded text-[10px] font-bold inline-flex items-center gap-1.5 text-white">
          <span class="text-amber-400 uppercase">${mode}:</span> ${tier}
          <button type="button" onclick="removeModeTier('${mode}')" class="text-rose-400 hover:text-rose-300 ml-1"><i class="fa-solid fa-xmark"></i></button>
        </span>
      `).join('');
    }

    function removeModeTier(mode) {
      delete currentEditingTiers[mode];
      renderAssignedPreview();
    }

    async function savePlayer(event) {
      event.preventDefault();
      const name = document.getElementById('admin-name').value.trim();
      const region = document.getElementById('admin-region').value;
      const retired = document.getElementById('admin-retired').checked;

      const playerObj = { name, region, retired, tiers: currentEditingTiers };
      const firebaseKey = name.toLowerCase();

      try {
        const res = await fetch(`${FIREBASE_DB_URL}players/${firebaseKey}.json`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(playerObj)
        });

        if (res.ok) {
          alert(`Successfully saved player: ${name}`);
          resetForm();
          loadAdminData();
        } else {
          alert('Error saving player to database.');
        }
      } catch (e) {
        console.error(e);
        alert('Network error while saving player.');
      }
    }

    function editPlayer(key) {
      const p = playersMap[key];
      if (!p) return;

      document.getElementById('admin-name').value = p.name;
      document.getElementById('admin-region').value = p.region || 'NA';
      document.getElementById('admin-retired').checked = !!p.retired;

      currentEditingTiers = p.tiers ? { ...p.tiers } : {};
      renderAssignedPreview();

      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    async function deletePlayer(key) {
      if (!confirm(`Are you sure you want to delete ${key} from the database?`)) return;

      try {
        const res = await fetch(`${FIREBASE_DB_URL}players/${key}.json`, {
          method: 'DELETE'
        });

        if (res.ok) {
          loadAdminData();
        } else {
          alert('Failed to delete player.');
        }
      } catch (e) {
        console.error(e);
      }
    }

    function resetForm() {
      document.getElementById('player-form').reset();
      currentEditingTiers = {};
      renderAssignedPreview();
    }

    function filterRoster() {
      const query = document.getElementById('roster-search').value.toLowerCase();
      const cards = document.querySelectorAll('#roster-list > div');
      cards.forEach(card => {
        const text = card.textContent.toLowerCase();
        card.style.display = text.includes(query) ? 'flex' : 'none';
      });
    }

    loadAdminData();
  </script>
</body>
</html>
